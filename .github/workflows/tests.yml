name: Tests

# Runs the whole suite on every push and pull request. The tests need no API keys —
# config.py defaults every setting to empty — so this needs no repository secrets.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Keep going when one version fails, so a break on an older Python doesn't hide
      # whether the newer one is fine.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --offline refuses every outbound socket inside the tests. The suite is hermetic
      # today, and enforcing that here is the point: without it, a test that quietly
      # starts calling a live API would still pass locally and then turn this job red
      # during someone else's outage.
      - name: Run tests (network blocked)
        run: python scripts/run_tests.py --offline
